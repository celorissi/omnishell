<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Login / Registo — OmniShell</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='favicon.png') }}">
  <style>
    body {
      background-color: #0b0f19;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      color: #e2e8f0;
    }
    .login-card {
      background: #131b2e;
      padding: 35px;
      border-radius: 12px;
      width: 440px;
      border: 1px solid #243252;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .brand-logo {
      width: 150px;
      margin-bottom: 15px;
      object-fit: contain;
    }
    h1 {
      font-size: 22px;
      color: #f4f4f5;
      margin-bottom: 6px;
      font-weight: 600;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .form-control {
      width: 100%;
      padding: 12px 15px;
      font-size: 14px;
      background-color: #1a243b;
      border: 1px solid #243252;
      color: #f4f4f5 !important;
      border-radius: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control::placeholder {
      color: #64748b;
      opacity: 1;
    }
    .form-control:focus {
      background-color: #1a243b;
      border-color: #00b4d8;
      box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.2);
      color: #f4f4f5 !important;
    }
    .button {
      width: 100%;
      padding: 14px 15px;
      font-size: 14px;
      font-weight: 600;
      background: linear-gradient(135deg, #0d8abc 0%, #005f73 100%);
      color: white;
      border: none;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(13, 138, 188, 0.3);
      cursor: pointer;
      transition: all 0.25s ease-in-out;
    }
    .button:hover {
      background: linear-gradient(135deg, #00b4d8 0%, #0d8abc 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(13, 138, 188, 0.45);
    }
    .btn-success-custom {
      background: linear-gradient(135deg, #0d8abc 0%, #005f73 100%);
      box-shadow: 0 2px 6px rgba(13, 138, 188, 0.3);
    }
    .btn-success-custom:hover {
      background: linear-gradient(135deg, #00b4d8 0%, #0d8abc 100%);
    }
    .text-muted {
      color: #94a3b8 !important;
    }
    .alert {
      color: #fca5a5;
      background-color: rgba(127, 29, 29, 0.3);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .switch-link {
      color: #38bdf8;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
    }
    .switch-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="brand-logo" onerror="this.style.display='none'" />
    <h1 id="cardTitle">OmniShell</h1>
    <p class="subtitle" id="cardSubtitle">Insira as suas credenciais. Contas novas requerem aprovação prévia do administrador do sistema antes do primeiro acesso.</p>

    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="formLogin" method="POST" action="/login">
      <input type="text" name="username" class="form-control" placeholder="Utilizador / Matrícula" required autofocus />
      <input type="password" name="password" class="form-control" placeholder="Palavra-passe / Senha Mestra" required />
      <button type="submit" class="button mb-3">Entrar no Portal</button>
      
      <div>
        <span class="text-muted small">Ainda não tem conta?</span> 
        <a onclick="alternarFormulario('register')" class="switch-link fw-semibold">Solicitar Conta</a>
      </div>
    </form>

    <!-- FORMULÁRIO DE REGISTO -->
    <form id="formRegister" class="d-none" method="POST" action="/register">
      <input type="text" name="username" class="form-control" placeholder="Defina seu Utilizador / Matrícula" required />
      <input type="password" name="password" class="form-control" placeholder="Defina sua Senha Mestra" required />
      <button type="submit" class="button btn-success-custom mb-3">Submeter Pedido de Registo</button>
      
      <div>
        <span class="text-muted small">Já tem conta aprovada?</span> 
        <a onclick="alternarFormulario('login')" class="switch-link fw-semibold">Fazer Login</a>
      </div>
    </form>
  </div>

  <script>
    function alternarFormulario(tipo) {
      const loginForm = document.getElementById('formLogin');
      const registerForm = document.getElementById('formRegister');
      const title = document.getElementById('cardTitle');
      const subtitle = document.getElementById('cardSubtitle');

      if (tipo === 'register') {
        loginForm.classList.add('d-none');
        registerForm.classList.remove('d-none');
        title.innerText = 'Solicitar Nova Conta';
        subtitle.innerText = 'Submeta o seu pedido. O acesso será libertado após validação e aprovação pelo administrador.';
      } else {
        registerForm.classList.add('d-none');
        loginForm.classList.remove('d-none');
        title.innerText = 'OmniShell';
        subtitle.innerText = 'Insira as suas credenciais. Contas novas requerem aprovação prévia do administrador do sistema antes do primeiro acesso.';
      }
    }
  </script>
</body>
</html>
